name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

# Pull requests cancel their older runs. Every master commit runs to the end:
# its metrics are the baseline for pull requests based on it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        hugo_version: [minimum, locked]
        hugo_env: [production, development]
    uses: ./.github/workflows/build.yml
    with:
      hugo_version: ${{ matrix.hugo_version }}
      hugo_env: ${{ matrix.hugo_env }}

  metrics:
    uses: ./.github/workflows/metrics.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      compare: ${{ github.event_name == 'pull_request' }}

  ci-gate:
    runs-on: ubuntu-latest
    needs: [ build-and-validate, metrics ]
    if: always()
    steps:
      - env:
          BUILD: ${{ needs.build-and-validate.result }}
          METRICS: ${{ needs.metrics.result }}
        run: |
          echo "build-and-validate result: $BUILD"
          echo "metrics result: $METRICS"
          if [ "$BUILD" != "success" ] || [ "$METRICS" != "success" ]; then
            exit 1
          fi
