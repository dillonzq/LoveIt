name: Metrics

# Measures the example site: Lighthouse, axe-core and build time. CI calls this
# workflow on every pull request and push to master. Master runs upload the
# `metrics` artifact that later pull requests use as their baseline; pull
# requests are compared with it, and a value worse than metrics-budget.json
# allows fails the job and therefore ci-gate.

on:
  workflow_call:
    inputs:
      compare:
        description: Compare with the master baseline
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      compare:
        description: Compare with the master baseline
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    # Includes up to baseline.waitMinutes for the base commit's own run.
    timeout-minutes: 45
    permissions:
      contents: read
      # Lists master runs and downloads their artifacts.
      actions: read
      # Reads the pull request's labels for the accept label.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/loveit
          key: hugo-tools-${{ runner.os }}-${{ hashFiles('.hvm', 'package-lock.json') }}
      - run: npx --no-install playwright install --with-deps chromium
      - name: Lighthouse, axe-core and build time
        env:
          HVM_GITHUB_TOKEN: ${{ github.token }}
        run: npm run metrics
      - name: Compare with master
        if: inputs.compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOVEIT_METRICS_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run metrics:compare
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics
          path: |
            build/metrics/
            !build/metrics/site/
            !build/metrics/cache/
            !build/metrics/resources/
          if-no-files-found: ignore
