{{- /* Renders a Markdown heading. With "Anchor", a link to the heading comes first; it is named by the heading itself, so it needs no JavaScript or translation. */ -}}
{{- $anchor := .Context.Anchor -}}
<h{{ .Context.Level }}
    {{- with $anchor }} id="{{ . }}"{{ end }}
    {{- range $k, $v := .Context.Attributes }}
        {{- if ne $k "id" }}{{ printf ` %s="%s"` $k (string $v | htmlEscape) | safeHTMLAttr }}{{ end -}}
    {{- end }}>
    {{- if and .Anchor $anchor -}}
        <a href="#{{ $anchor }}" class="header-mark" aria-labelledby="{{ $anchor }}"></a>
    {{- end -}}
    {{- .Context.Text -}}
</h{{ .Context.Level }}>
